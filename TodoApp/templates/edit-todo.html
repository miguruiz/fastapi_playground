{% include 'layout.html' %}

<div class="container">
    <div class="card">
        <div class="card-header">
            Edit a todo
        </div>
        <div class="card-body">
            <form id="editTodoForm">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" class="form-control" name="title"  value="{{ todo.title }}" required>
                </div>
                <div class="form-group">
                <label> Description</label>
                    <textarea class="form-control" rows="3" name="description" required>{{ todo.description }}</textarea>
                </div>
                <div class="form-group">
                <label>Priority</label>
                    <select class="form-control" name="priority">
                        {% for i in range(1, 6) %}
                            <option value="{{ i }}" {% if todo.priority == i %}selected{% endif %}>{{ i }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" name="complete" id="complete"
                        {% if todo.complete %}checked{% endif %}>
                    <label class="form-check-label" for="complete">Complete</label>
                </div>
                <button type="submit" id="editButton" class="btn btn-primary"> Save </button>
                <a href="/todos/todo-page" class="btn btn-success">Back</a>
                <button type="submit" id="deleteButton" class="btn btn-danger"> Delete </button>
            </form>
        </div>
    </div>
</div>
